version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    ignore:
      # 6.30.5 was an incomplete publish; 6.30.6 changes useNavigate colon URL
      # handling. package.json pins <6.30.5; keep 7.x ignored until migration.
      - dependency-name: 'react-router-dom'
        versions: ['7.x.x', '6.30.5', '6.30.6']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-environment-jsdom'
        update-types: ['version-update:semver-major']
      # ts-patch v4+ targets TypeScript 6; keep 3.x while on TypeScript 5.9.x
      - dependency-name: 'ts-patch'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Compromised versions from https://www.stepsecurity.io/blog/multiple-redhat-cloud-services-npm-packages-compromised
      - dependency-name: '@redhat-cloud-services/types'
        versions: ['3.6.1', '3.6.2', '3.6.4']
      - dependency-name: '@redhat-cloud-services/frontend-components-utilities'
        versions: ['7.4.1', '7.4.2', '7.4.4']
      - dependency-name: '@redhat-cloud-services/frontend-components'
        versions: ['7.7.2', '7.7.3', '7.7.5']
      - dependency-name: '@redhat-cloud-services/frontend-components-config'
        versions: ['6.11.3', '6.11.4', '6.11.6']
      - dependency-name: '@redhat-cloud-services/tsc-transform-imports'
        versions: ['1.2.2', '1.2.4', '1.2.6']
    commit-message:
      prefix: 'Build: '
    groups:
      npm:
        patterns:
          - '*'
