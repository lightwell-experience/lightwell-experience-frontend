name: 'E2E tests: Prod'
on:
  schedule:
    - cron: '0 12 * * *' # Daily at 12:00 UTC (noon)

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-integration-test:
    runs-on:
      - codebuild-lightwell-experience-integration-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large
      - buildspec-override:true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get prod tests
        run: ./.github/workflowScripts/getProdTests.sh

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            dist
          key: ${{ runner.os }}-frontend-node-modules-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-frontend-node-modules-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Playwright
        run: yarn playwright install chromium --only-shell

      - name: Create .env file
        run: |
          echo "PROD=true" >> .env
          echo "CI=true" >> .env
          echo "INTEGRATION=true" >> .env
          echo "BASE_URL=$PROD_BASE_URL" >> .env
          echo "PROXY=$RH_PROXY_URL" >> .env

          if [ -z "$PROD_CREDS" ]; then
            echo "::warning::PROD_CREDS secret is not set."
          else
            printf '%s' "$PROD_CREDS" > creds.json
          fi

          echo "✅ Environment file created successfully"

      - name: Run Playwright tests
        run: yarn playwright test

      - name: Publish test report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './playwright-ctrf/playwright-ctrf.json'
        if: ${{ !cancelled() }}

      - name: Store report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./playwright-ctrf
          retention-days: 10
