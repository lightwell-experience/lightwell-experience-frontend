name: Build & Unit Tests
on:
  merge_group:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# pull_request checks out the PR head. merge_group has no pull_request
# payload; github.sha is the merge-queue commit.
env:
  CHECKOUT_REF: ${{ (github.event_name == 'merge_group' && github.sha) || github.event.pull_request.head.sha }}

jobs:
  malware-scan:
    runs-on: ubuntu-latest
    name: malware-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Supply chain malware scan
        working-directory: .github/
        env:
          # pull_request.base.ref is the bare branch name. merge_group.base_ref
          # is a full ref (refs/heads/main) and is absent on pull_request.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          if [ -z "$PR_BASE_REF" ]; then
            PR_BASE_REF="${MERGE_GROUP_BASE_REF#refs/heads/}"
          fi
          export PR_BASE_REF
          chmod +x workflowScripts/malware-pr-check.py
          python3 workflowScripts/malware-pr-check.py

  vulnerability-review:
    runs-on: ubuntu-latest
    name: vulnerability-review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Known vulnerability review
        uses: actions/dependency-review-action@v5
        with:
          comment-summary-in-pr: on-failure
          vulnerability-check: true
          license-check: false
          # No 6.x patch exists; fixed only in react-router 7.18.0+.
          # Chrome still provides react-router-dom 6.x as a Module Federation
          # singleton (import: false), so this remote cannot move to v7.
          # GHSA-337j-9hxr-rhxg applies to SSR/Framework Mode; this app uses Declarative Mode.
          # GHSA-wrjc-x8rr-h8h6 is a client-side open redirect with no 6.x fix.
          # Revisit when chrome publishes a patched shared router.
          allow-ghsas: GHSA-wrjc-x8rr-h8h6, GHSA-337j-9hxr-rhxg

  lint:
    needs: [malware-scan, vulnerability-review]
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Cache - node_modules
        if: always()
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-build-test-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  format:
    needs: [malware-scan, vulnerability-review]
    runs-on: ubuntu-latest
    name: format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Cache - node_modules
        if: always()
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-build-test-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Format code with prettier
        run: yarn format:check

  build-check:
    needs: [malware-scan, vulnerability-review]
    runs-on: ubuntu-latest
    name: build-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Cache - node_modules
        if: always()
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-build-test-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build the application
        run: yarn build

  unit-test:
    needs: [malware-scan, vulnerability-review]
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Cache - node_modules
        if: always()
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-build-test-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Tests
        run: yarn test

      - name: Convert JUnit report to CTRF format
        if: always()
        run: npx junit-to-ctrf test-results/jest-junit.xml -o test-results/ctrf-report.json

      - name: Report test results
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: ./test-results/ctrf-report.json
